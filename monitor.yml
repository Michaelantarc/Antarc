name: Monitor Mercari

on:
  schedule:
    # Roda a cada 4 horas (6x por dia). Horário em UTC.
    # UTC 0,4,8,12,16,20 = Brasília (UTC-3) 21h,1h,5h,9h,13h,17h aprox.
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write # necessário para o workflow poder commitar o state.json

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_mercari.py

      - name: Salvar state.json (para não repetir alertas)
        run: |
          git config user.name "mercari-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Atualiza state.json [skip ci]"
          git push
