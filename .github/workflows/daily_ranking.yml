name: Daily Mercari Ranking Update

on:
  schedule:
    - cron: '0 0 * * *' # Roda todos os dias às 00:00 UTC
  workflow_dispatch: # Permite rodar manualmente quando quiser

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que a Action faça commits no seu repositório

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Ranking & Update README
        run: python daily_ranking.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily mercari ranking [skip ci]" && git push)
