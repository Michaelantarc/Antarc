name: Build Database & Match

on:
  workflow_dispatch:

jobs:
  build_and_match:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install rapidfuzz requests beautifulsoup4

      - name: Build Character Catalog
        run: python build_character_catalog.py

      - name: Run Build Figure Database
        run: python build_database.py

      - name: Run Match Figures
        run: python match_figures.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update character catalog & figure database [skip ci]" && git push)
