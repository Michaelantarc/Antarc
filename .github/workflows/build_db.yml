name: Build Database & Match

on:
  workflow_dispatch:
  schedule:
    # Agendamento para rodar sozinho a cada 2 horas
    - cron: '0 */2 * * *'

jobs:
  build_and_match:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install cloudscraper rapidfuzz requests beautifulsoup4
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # 🚨 Script antigo foi removido daqui! O build_database.py fará tudo sozinho.
      - name: Run Build Figure Database
        run: python build_database.py

      - name: Run Match Figures
        run: python match_figures.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update database [skip ci]"
          git pull origin master --rebase
          git push
